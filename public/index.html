<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestión de Proveedores</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #dc2626;
    }

    .secondary {
      background: #6b7280;
    }

    .success {
      background: #16a34a;
    }

    input {
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 10px;
    }

    .search {
      display: flex;
      gap: 10px;
    }

    .search input {
      margin: 0;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    .hidden {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #eef2ff;
    }

    @media (max-width: 700px) {
      table {
        font-size: 12px;
      }

      .search {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Gestión de Proveedores</h1>
</header>

<div class="container">

  <div id="mensaje" class="message hidden"></div>

  <div class="card">

    <div class="buttons">

      <button onclick="buscarProveedores()">
        🔎 Buscar
      </button>

      <button onclick="verTodos()" class="secondary">
        Ver todos
      </button>

      <button onclick="mostrarFormulario()" class="success">
        ➕ Agregar proveedor
      </button>

      <button onclick="descargarPlantilla()" class="secondary">
        📄 Plantilla Excel
      </button>

      <button onclick="document.getElementById('excel').click()">
        📊 Importar Excel
      </button>

      <button onclick="exportarExcel()" class="success">
        📥 Exportar Excel
      </button>

      <button onclick="cerrarSesion()" class="danger">
        Salir
      </button>

    </div>

    <div class="search">
      <input
        id="busqueda"
        type="text"
        placeholder="Código, proveedor, RUC, teléfono o correo..."
        onkeydown="if(event.key === 'Enter') buscarProveedores()"
      >

      <button onclick="buscarProveedores()">
        Buscar
      </button>
    </div>

    <input
      id="excel"
      type="file"
      accept=".xlsx,.xls"
      class="hidden"
      onchange="importarExcel()"
    >

  </div>

  <div class="card">

    <table>

      <thead>
        <tr>
          <th>Código</th>
          <th>Proveedor</th>
          <th>RUC</th>
          <th>Teléfono</th>
          <th>Correo</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="tabla">
      </tbody>

    </table>

  </div>

</div>

<!-- FORMULARIO -->

<div id="modal" class="modal hidden">

  <div class="modal-content">

    <h2 id="tituloFormulario">
      Agregar proveedor
    </h2>

    <input
      id="codigo"
      placeholder="Código"
    >

    <input
      id="proveedor"
      placeholder="Nombre del proveedor"
    >

    <input
      id="ruc"
      placeholder="RUC"
    >

    <input
      id="telefono"
      placeholder="Teléfono"
    >

    <input
      id="correo"
      placeholder="Correo"
    >

    <div class="buttons">

      <button onclick="guardarProveedor()" class="success">
        Guardar
      </button>

      <button onclick="cerrarFormulario()" class="secondary">
        Cancelar
      </button>

    </div>

  </div>

</div>

<script>

let proveedorEditando = null;

function mostrarMensaje(texto) {

  const mensaje =
    document.getElementById("mensaje");

  mensaje.textContent = texto;

  mensaje.classList.remove("hidden");

  setTimeout(() => {
    mensaje.classList.add("hidden");
  }, 4000);
}


// ================================
// CARGAR PROVEEDORES
// ================================

async function cargarProveedores(q = "") {

  try {

    const respuesta =
      await fetch(
        "/api/proveedores?q=" +
        encodeURIComponent(q)
      );

    if (respuesta.status === 401) {

      mostrarMensaje(
        "Sesión no autorizada."
      );

      return;
    }

    if (!respuesta.ok) {

      throw new Error(
        "Error consultando proveedores"
      );
    }

    const proveedores =
      await respuesta.json();

    mostrarTabla(proveedores);

  } catch (error) {

    console.error(error);

    mostrarMensaje(
      "No se pudieron cargar los proveedores."
    );
  }
}


// ================================
// MOSTRAR TABLA
// ================================

function mostrarTabla(proveedores) {

  const tabla =
    document.getElementById("tabla");

  tabla.innerHTML = "";

  if (proveedores.length === 0) {

    tabla.innerHTML = `
      <tr>
        <td colspan="6">
          No se encontraron proveedores.
        </td>
      </tr>
    `;

    return;
  }

  proveedores.forEach(p => {

    const fila =
      document.createElement("tr");

    fila.innerHTML = `

      <td>${escapeHTML(p.codigo || "")}</td>

      <td>${escapeHTML(p.proveedor || "")}</td>

      <td>${escapeHTML(p.ruc || "")}</td>

      <td>${escapeHTML(p.telefono || "")}</td>

      <td>${escapeHTML(p.correo || "")}</td>

      <td>

        <button
          onclick='editarProveedor(${JSON.stringify(p)})'>
          ✏️
        </button>

        <button
          class="danger"
          onclick="eliminarProveedor('${p._id}')">
          🗑️
        </button>

      </td>

    `;

    tabla.appendChild(fila);

  });
}


// ================================
// BUSCAR
// ================================

function buscarProveedores() {

  const texto =
    document
      .getElementById("busqueda")
      .value
      .trim();

  cargarProveedores(texto);
}


// ================================
// VER TODOS
// ================================

function verTodos() {

  document
    .getElementById("busqueda")
    .value = "";

  cargarProveedores();
}


// ================================
// AGREGAR / EDITAR
// ================================

function mostrarFormulario() {

  proveedorEditando = null;

  document
    .getElementById("tituloFormulario")
    .textContent =
    "Agregar proveedor";

  limpiarFormulario();

  document
    .getElementById("modal")
    .classList.remove("hidden");
}


function editarProveedor(p) {

  proveedorEditando = p._id;

  document
    .getElementById("tituloFormulario")
    .textContent =
    "Editar proveedor";

  document
    .getElementById("codigo")
    .value =
    p.codigo || "";

  document
    .getElementById("proveedor")
    .value =
    p.proveedor || "";

  document
    .getElementById("ruc")
    .value =
    p.ruc || "";

  document
    .getElementById("telefono")
    .value =
    p.telefono || "";

  document
    .getElementById("correo")
    .value =
    p.correo || "";

  document
    .getElementById("modal")
    .classList.remove("hidden");
}


function cerrarFormulario() {

  document
    .getElementById("modal")
    .classList.add("hidden");
}


function limpiarFormulario() {

  document
    .getElementById("codigo")
    .value = "";

  document
    .getElementById("proveedor")
    .value = "";

  document
    .getElementById("ruc")
    .value = "";

  document
    .getElementById("telefono")
    .value = "";

  document
    .getElementById("correo")
    .value = "";
}


// ================================
// GUARDAR
// ================================

async function guardarProveedor() {

  const datos = {

    codigo:
      document.getElementById("codigo").value,

    proveedor:
      document.getElementById("proveedor").value,

    ruc:
      document.getElementById("ruc").value,

    telefono:
      document.getElementById("telefono").value,

    correo:
      document.getElementById("correo").value
  };

  if (!datos.codigo || !datos.proveedor) {

    alert(
      "Código y proveedor son obligatorios."
    );

    return;
  }

  try {

    let respuesta;

    if (proveedorEditando) {

      respuesta =
        await fetch(
          "/api/proveedores/" +
          proveedorEditando,
          {
            method: "PUT",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(datos)
          }
        );

    } else {

      respuesta =
        await fetch(
          "/api/proveedores",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(datos)
          }
        );
    }

    const resultado =
      await respuesta.json();

    if (!respuesta.ok) {

      throw new Error(
        resultado.error ||
        "No se pudo guardar."
      );
    }

    cerrarFormulario();

    mostrarMensaje(
      "Proveedor guardado correctamente."
    );

    cargarProveedores();

  } catch (error) {

    alert(error.message);
  }
}


// ================================
// ELIMINAR
// ================================

async function eliminarProveedor(id) {

  const confirmar =
    confirm(
      "¿Seguro que quieres eliminar este proveedor?"
    );

  if (!confirmar) {
    return;
  }

  try {

    const respuesta =
      await fetch(
        "/api/proveedores/" + id,
        {
          method: "DELETE"
        }
      );

    const resultado =
      await respuesta.json();

    if (!respuesta.ok) {

      throw new Error(
        resultado.error ||
        "No se pudo eliminar."
      );
    }

    mostrarMensaje(
      "Proveedor eliminado."
    );

    cargarProveedores();

  } catch (error) {

    alert(error.message);
  }
}


// ================================
// EXCEL
// ================================

async function importarExcel() {

  const archivo =
    document.getElementById("excel")
      .files[0];

  if (!archivo) {
    return;
  }

  const formData =
    new FormData();

  formData.append(
    "archivo",
    archivo
  );

  try {

    mostrarMensaje(
      "Importando Excel..."
    );

    const respuesta =
      await fetch(
        "/api/importar-excel",
        {
          method: "POST",
          body: formData
        }
      );

    const resultado =
      await respuesta.json();

    if (!respuesta.ok) {

      throw new Error(
        resultado.error ||
        "Error importando Excel."
      );
    }

    alert(
      "Importación terminada.\n\n" +
      "Nuevos: " +
      resultado.creados +
      "\nActualizados: " +
      resultado.actualizados +
      "\nErrores: " +
      resultado.errores
    );

    cargarProveedores();

  } catch (error) {

    alert(error.message);
  }

  document
    .getElementById("excel")
    .value = "";
}


function exportarExcel() {

  window.location.href =
    "/api/exportar-excel";
}


function descargarPlantilla() {

  window.location.href =
    "/api/plantilla-excel";
}


// ================================
// LOGOUT
// ================================

async function cerrarSesion() {

  await fetch(
    "/api/logout",
    {
      method: "POST"
    }
  );

  location.reload();
}


// ================================
// SEGURIDAD HTML
// ================================

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// ================================
// LOGIN
// ================================

async function comprobarSesion() {

  try {

    const respuesta =
      await fetch("/api/auth/status");

    const estado =
      await respuesta.json();

    if (!estado.loggedIn) {

      mostrarLogin();

      return false;
    }

    return true;

  } catch (error) {

    console.error(error);

    mostrarMensaje(
      "No se pudo comprobar la sesión."
    );

    return false;
  }
}


function mostrarLogin() {

  document.body.innerHTML = `

    <div style="
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f4f6f8;
      padding:20px;
    ">

      <div style="
        background:white;
        padding:30px;
        border-radius:12px;
        width:100%;
        max-width:400px;
        box-shadow:0 3px 15px rgba(0,0,0,.1);
      ">

        <h2 style="text-align:center;">
          🔐 Gestión de Proveedores
        </h2>

        <p style="text-align:center;">
          Inicia sesión para continuar
        </p>

        <input
          id="loginUsuario"
          type="text"
          placeholder="Usuario"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Contraseña"
        >

        <button
          onclick="iniciarSesion()"
          style="width:100%;"
        >
          Iniciar sesión
        </button>

        <p
          id="loginError"
          style="
            color:#dc2626;
            text-align:center;
          "
        ></p>

      </div>

    </div>

  `;
}


async function iniciarSesion() {

  const username =
    document.getElementById(
      "loginUsuario"
    ).value;

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  try {

    const respuesta =
      await fetch(
        "/api/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const resultado =
      await respuesta.json();

    if (!respuesta.ok) {

      document.getElementById(
        "loginError"
      ).textContent =
        resultado.error ||
        "Credenciales incorrectas.";

      return;
    }

    location.reload();

  } catch (error) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Error conectando con el servidor.";
  }
}


// ================================
// INICIO
// ================================

comprobarSesion()
  .then(logueado => {

    if (logueado) {
      cargarProveedores();
    }

  });
